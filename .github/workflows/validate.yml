name: Selected change checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run explicitly selected checks; report unknown impact
        run: python scripts/iteration/ci_selected.py --manifest docs/iterations/full-native-ci-checks.json --out test-runs/ci-selected
      - name: Keep selected commands and original logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: selected-change-checks
          path: test-runs/ci-selected
