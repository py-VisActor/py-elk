name: Bootstrap and source provenance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check.py --out test-runs/ci
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/upstream.py fetch
      - run: python scripts/upstream.py check
      - run: node --version
      - run: python scripts/validate_layout.py reference --out test-runs/ci-reference --repeat 3
      - run: python scripts/validate_layout.py replay --reference references/layout --candidate test-runs/ci-reference --out test-runs/ci-replay.json
