# Action refs were read from official repositories using the GitHub connector.
name: Publish reviewed py-elk release
on:
  push:
    tags: ['v0.1.0']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Require frozen validation and reviewed candidate repair evidence
        run: |
          python scripts/iteration/release_readiness.py --source-only
      - name: Install pinned build tools
        run: python -m pip install build==1.6.1 setuptools==84.2.1 wheel==0.48.0
      - name: Build wheel and source distribution
        run: python -m build --no-isolation --outdir dist
      - name: Verify exact payload and isolated installation
        run: python scripts/validate_full_package.py --wheel dist/*.whl --sdist dist/*.tar.gz --out test-runs/release-install --exercise-mrtree-cycle tests/fixtures/suites/full-option-effects-nonlayered/requests/mrtree-cycle-bfs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-distributions
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-install-observations
          path: test-runs/release-install/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/py-visactor-elk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # official v4.3.0
        with:
          name: reviewed-distributions
          path: dist/
      - name: Publish using the configured Trusted Publisher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # official release/v1 at preparation
        with:
          packages-dir: dist/
