name: Publish reviewed py-elk release
on:
  push:
    tags: ['v0.1.1', 'v0.1.1-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify version-only runtime delta from published tag
        run: python scripts/documentation_release.py guard
      - name: Install pinned build tools
        run: python -m pip install build==1.6.1 setuptools==84.2.1 wheel==0.48.0 packaging==26.3
      - name: Build one immutable distribution pair
        run: python -m build --no-isolation --outdir dist
      - name: Verify user README and Documentation metadata
        run: python scripts/documentation_release.py manifest --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-distributions
          path: dist/
          if-no-files-found: error
  validate:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-distributions
          path: dist/
      - name: Download offline source-build prerequisites
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse setuptools==84.2.1 wheel==0.48.0 packaging==26.3
      - name: Install both exact artifacts outside repository and run related smoke
        run: python scripts/documentation_release.py install --dist dist --out test-runs/release-installed --wheelhouse wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-${{ matrix.os }}
          path: test-runs/release-installed/
  publish:
    needs: [build, validate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/py-visactor-elk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-distributions
          path: dist/
      - name: Stage only the two verified distribution files
        run: |
          python -c "from pathlib import Path; import shutil,json,hashlib; source=Path('dist'); out=Path('publish-dist'); out.mkdir(); manifest=json.loads((source/'release-manifest.json').read_text()); [(shutil.copyfile(source/name,out/name)) for name in manifest['distributions']]; assert all(hashlib.sha256((out/name).read_bytes()).hexdigest()==value['sha256'] for name,value in manifest['distributions'].items())"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: publish-dist/
  verify-publication:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-distributions
          path: dist/
      - name: Verify actual PyPI metadata and downloaded bytes
        run: python scripts/documentation_release.py readback --dist dist --out test-runs/published
      - name: Obtain source-build prerequisites
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse setuptools==84.2.1 wheel==0.48.0 packaging==26.3
      - name: Install actual PyPI downloads independently
        run: python scripts/documentation_release.py install --dist test-runs/published/packages --out test-runs/published-installed --wheelhouse wheelhouse
      - name: Publish GitHub release with the same verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/documentation_release.py github --dist dist --out test-runs/published
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-publication
          path: |
            test-runs/published/
            test-runs/published-installed/
