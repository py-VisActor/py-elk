[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-visactor-elk"
version = "0.1.1"
description = "Native Python ELK graph layout, asynchronous execution and metadata"
readme = "README.md"
license = "MIT AND (EPL-2.0 OR GPL-3.0-or-later) AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/pyelk/_licenses/*.md", "src/pyelk/_licenses/*.txt"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dev = ["build==1.6.1", "setuptools==84.2.1", "wheel==0.48.0"]

[project.urls]
Repository = "https://github.com/py-VisActor/py-elk"
Documentation = "https://github.com/py-VisActor/py-elk/blob/main/docs/README.md"
Source = "https://github.com/py-VisActor/py-elk"
Issues = "https://github.com/py-VisActor/py-elk/issues"
Changelog = "https://github.com/py-VisActor/py-elk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
pyelk = ["py.typed", "_licenses/*.md", "_licenses/*.txt"]
